config_version: 1
control_plane:
  base_url: "https://api.openai.com"

  tunnel_id: "tunnel_6aa560df869c8191afd993f5bd569d54"
  api_key: "env:CONTROL_PLANE_API_KEY"
health:
  # Keep a fixed port when you want a stable local admin URL.
  # For concurrent or clean-room runs, switch listen_addr to "127.0.0.1:0" and
  # set url_file so another process can discover the resolved /healthz, /readyz,
  # /metrics, and /ui base URL.
  listen_addr: "127.0.0.1:0"
  # url_file: "/tmp/tunnel-client-health.url"
admin_ui:
  open_browser: false
log:
  level: info
  format: json
mcp:
  commands:
    - channel: main
      command: "'C:/Users/Admin/.local/bin/uv.exe' run --with mcp==2.2.0 --python 3.13 'H:/AI/Codex-app-tunnel/local-bridge/server.py' --config 'H:/AI/Codex-app-tunnel/local-bridge/config.json'"
