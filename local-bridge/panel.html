</style>
    <script>
      (() => {
        const TAB_ID = "tab-mcp-diagnostics";
        const PANEL_ID = "panel-mcp-diagnostics";
        const pending = new Map();
        const sensitiveKey = /token|secret|credential|password|authorization|\.env/i;
        let sequence = 0;
        let active = false;
        let loading = false;
        let snapshot = null;
        let uiHost = null;

        const el = (tag, className, content) => {
          const node = document.createElement(tag);
          if (className) node.className = className;
          if (content !== undefined) node.textContent = String(content);
          return node;
        };
        const safeCopy = (value, key) => {
          if (key && sensitiveKey.test(key)) return "[omitted]";
          if (Array.isArray(value)) return value.map(item => safeCopy(item));
          if (value && typeof value === "object") {
            return Object.fromEntries(Object.entries(value).map(([name, item]) => [name, safeCopy(item, name)]));
          }
          return value;
        };
        const json = value => JSON.stringify(safeCopy(value), null, 2);
        const display = value => {
          if (value === null || value === undefined || value === "") return "unknown";
          if (typeof value === "boolean") return value ? "yes" : "no";
          return String(value);
        };

        const rpc = (method, params = {}) => new Promise((resolve, reject) => {
          if (window.parent === window) {
            reject(new Error("MCP host unavailable"));
            return;
          }
          const id = `mcp-diagnostics-${Date.now()}-${++sequence}`;
          const timer = setTimeout(() => {
            pending.delete(id);
            reject(new Error(`MCP request timed out: ${method}`));
          }, 15000);
          pending.set(id, { resolve, reject, timer });
          window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
        });

        window.addEventListener("message", event => {
          if (event.source !== window.parent) return;
          const message = event.data;
          if (message?.id && pending.has(message.id)) {
            const request = pending.get(message.id);
            pending.delete(message.id);
            clearTimeout(request.timer);
            if (message.error) request.reject(new Error(message.error.message || "MCP request failed"));
            else request.resolve(message.result);
          }
          const result = message?.result;
          if (result && (result.protocolVersion || result.hostInfo || result.hostCapabilities)) {
            uiHost = {
              protocol_version: result.protocolVersion || null,
              client_info: result.hostInfo || null,
              client_capabilities: result.hostCapabilities || null,
              host_context: result.hostContext || null,
            };
            if (active) render();
          }
        });

        const getPanel = () => {
          let panel = document.getElementById(PANEL_ID);
          if (panel) return panel;
          const nav = document.querySelector('[role="tablist"]');
          if (!nav) return null;
          panel = el("section", "w-full rounded-[var(--radius-md)] border border-[var(--border)] bg-[var(--surface)] p-5 shadow-sm");
          panel.id = PANEL_ID;
          panel.setAttribute("role", "tabpanel");
          panel.setAttribute("aria-labelledby", TAB_ID);
          panel.style.display = "none";
          nav.insertAdjacentElement("afterend", panel);
          return panel;
        };

        const hideOtherPanels = () => document.querySelectorAll('[role="tabpanel"]').forEach(panel => {
          panel.style.display = panel.id === PANEL_ID ? "" : "none";
        });
        const restoreOtherPanels = () => document.querySelectorAll('[role="tabpanel"]').forEach(panel => {
          if (panel.id !== PANEL_ID) panel.style.display = "";
        });
        const setTabs = selected => document.querySelectorAll('[role="tab"]').forEach(tab => {
          tab.setAttribute("aria-selected", tab.id === selected ? "true" : "false");
        });

        const addValue = (grid, label, value) => {
          const card = el("div", "rounded-[var(--radius-sm)] border border-[var(--border)] bg-[var(--surface-elevated)] p-3");
          card.appendChild(el("div", "font-mono text-[10px] uppercase tracking-wider text-[var(--text-faint)]", label));
          if (value && typeof value === "object") {
            const pre = el("pre", "mt-1 max-h-[250px] overflow-auto whitespace-pre-wrap break-all font-mono text-xs text-[var(--code-text)]", json(value));
            card.appendChild(pre);
          } else {
            card.appendChild(el("div", "mt-1 break-all font-mono text-xs text-[var(--text)]", display(value)));
          }
          grid.appendChild(card);
        };

        const copyDiagnostics = async button => {
          const data = snapshot ? { ...snapshot } : { status: "loading" };
          if (uiHost) {
            data.ui_protocol_version = uiHost.protocol_version;
            data.ui_host_info = uiHost.client_info;
            data.ui_host_capabilities = uiHost.client_capabilities;
          }
          const text = json(data);
          let copied = false;
          try {
            if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(text);
            else throw new Error("clipboard API unavailable");
            copied = true;
          } catch (_) {
            const area = el("textarea");
            area.value = text;
            area.style.cssText = "position:fixed;left:-9999px;top:0";
            document.body.appendChild(area);
            area.select();
            try { copied = document.execCommand("copy"); } catch (_) { copied = false; }
            area.remove();
          }
          button.textContent = copied ? "Copied" : "Copy failed";
          setTimeout(() => { button.textContent = "Copy diagnostics"; }, 1600);
        };

        function render() {
          const panel = getPanel();
          if (!panel) return;
          panel.style.display = active ? "" : "none";
          if (!active) return;
          hideOtherPanels();
          panel.replaceChildren();
          const header = el("div", "flex flex-wrap items-start justify-between gap-3");
          const heading = el("div", "min-w-0");
          heading.appendChild(el("div", "font-mono text-[10px] uppercase tracking-[0.18em] text-[var(--accent)]", "MCP"));
          heading.appendChild(el("h2", "mt-1 text-2xl font-semibold tracking-tight text-[var(--text)]", "MCP Protocol Diagnostics"));
          heading.appendChild(el("p", "mt-1 max-w-[62ch] text-xs leading-relaxed text-[var(--text-muted)]", "Authoritative protocol/session metadata for bridge debugging. Sensitive values are omitted."));
          const copy = el("button", "rounded-[var(--radius-sm)] border border-[var(--border-hover)] bg-[var(--surface-elevated)] px-3 py-2 font-mono text-[10px] uppercase tracking-wider text-[var(--text-muted)] hover:border-[var(--accent)] hover:text-[var(--accent)]", "Copy diagnostics");
          copy.type = "button";
          copy.addEventListener("click", () => copyDiagnostics(copy));
          header.append(heading, copy);
          panel.appendChild(header);

          if (loading) {
            panel.appendChild(el("div", "mt-5 rounded-[var(--radius-sm)] border border-[var(--border)] bg-[var(--surface-elevated)] p-4 font-mono text-xs text-[var(--text-muted)]", "Reading MCP diagnostics…"));
            return;
          }
          if (!snapshot) return;
          if (snapshot.status === "error") {
            const error = el("div", "mt-5 rounded-[var(--radius-sm)] border border-[var(--danger-border)] bg-[var(--danger-soft)] p-4");
            error.appendChild(el("div", "font-mono text-[10px] uppercase tracking-wider text-[var(--danger)]", snapshot.error_code || "MCP_DIAGNOSTICS_UNAVAILABLE"));
            error.appendChild(el("div", "mt-2 text-sm text-[var(--text)]", snapshot.message || "Diagnostics unavailable"));
            if (snapshot.technical_message) error.appendChild(el("pre", "mt-2 whitespace-pre-wrap break-all font-mono text-xs text-[var(--code-text)]", snapshot.technical_message));
            panel.appendChild(error);
            return;
          }

          const data = { ...snapshot };
          if (uiHost?.protocol_version) data.ui_protocol_version = uiHost.protocol_version;
          if (uiHost?.client_info) data.ui_host_info = uiHost.client_info;
          if (uiHost?.client_capabilities) data.ui_host_capabilities = uiHost.client_capabilities;
          const grid = el("div", "mt-5 grid grid-cols-1 gap-3 sm:grid-cols-2");
          [
            ["Connection", data.connection_state],
            ["MCP protocol version", data.protocol_version],
            ["UI bridge protocol version", data.ui_protocol_version],
            ["Python MCP SDK version", data.sdk_version],
            ["Bridge version", data.bridge_version],
            ["Legacy compatibility mode", data.legacy_compatibility_mode],
            ["Apps support", data.apps_support],
            ["Tasks support (MCP)", data.tasks_support],
            ["Tasks support (bridge)", data.local_tasks_support],
            ["Subscriptions support", data.subscriptions_support],
            ["Structured output support", data.structured_output_support],
            ["Cache hints support", data.cache_hints_support],
            ["Cache hints configured", data.cache_hints_configured],
            ["Current project", data.current_project],
            ["Resource URI", data.resource_uri],
            ["Apps extension", data.apps_extension_id],
            ["Runtime state", data.runtime_state],
            ["Server info", data.server_info],
            ["MCP client info", data.client_info],
            ["UI host info", data.ui_host_info],
          ].forEach(([label, value]) => addValue(grid, label, value));
          panel.appendChild(grid);
          const capabilities = el("div", "mt-3 grid grid-cols-1 gap-3 sm:grid-cols-2");
          addValue(capabilities, "Server capabilities (authoritative)", data.server_capabilities);
          addValue(capabilities, "MCP client capabilities (authoritative when known)", data.client_capabilities);
          addValue(capabilities, "UI host capabilities", data.ui_host_capabilities);
          addValue(capabilities, "Supported modern protocol versions", data.supported_protocol_versions);
          addValue(capabilities, "Apps extension settings", data.apps_extension);
          panel.appendChild(capabilities);
        }

        async function load() {
          if (loading) return;
          loading = true;
          render();
          if (window.parent === window) {
            snapshot = {
              status: "ok", connection_state: "disconnected", protocol_version: "simulation",
              supported_protocol_versions: [], sdk_version: null, bridge_version: "simulation",
              server_capabilities: {}, client_capabilities: null, apps_support: null,
              apps_extension_id: "unknown", apps_extension: null, tasks_support: null,
              local_tasks_support: null, subscriptions_support: null, structured_output_support: null,
              cache_hints_support: null, cache_hints_configured: null, legacy_compatibility_mode: null,
              current_project: null, resource_uri: "ui://local-bridge/control-panel-v2.html", runtime_state: null,
            };
          } else {
            try {
              const result = await rpc("tools/call", { name: "mcp_diagnostics", arguments: {} });
              snapshot = result?.structuredContent || result;
              if (!snapshot || typeof snapshot !== "object") throw new Error("MCP diagnostics returned no structured content");
            } catch (error) {
              snapshot = { status: "error", error_code: "MCP_DIAGNOSTICS_UNAVAILABLE", message: error.message, retryable: true };
            }
          }
          loading = false;
          render();
        }

        const install = () => {
          const systemTab = document.getElementById("tab-system");
          if (!systemTab) return false;
          const holder = systemTab.parentElement;
          let diagnosticsTab = document.getElementById(TAB_ID);
          if (!diagnosticsTab) {
            diagnosticsTab = el("button", systemTab.className, "MCP Diagnostics");
            diagnosticsTab.id = TAB_ID;
            diagnosticsTab.type = "button";
            diagnosticsTab.setAttribute("role", "tab");
            diagnosticsTab.setAttribute("aria-controls", PANEL_ID);
            diagnosticsTab.setAttribute("aria-selected", "false");
            diagnosticsTab.addEventListener("click", event => {
              event.preventDefault();
              event.stopPropagation();
              active = true;
              setTabs(TAB_ID);
              getPanel();
              hideOtherPanels();
              render();
              load();
            });
            const actionGroup = Array.from(holder.children).find(child => child !== systemTab && child.className?.includes("border-l"));
            holder.insertBefore(diagnosticsTab, actionGroup || null);
          }
          if (!holder.dataset.mcpDiagnosticsBound) {
            holder.dataset.mcpDiagnosticsBound = "true";
            holder.addEventListener("click", event => {
              const tab = event.target.closest?.('[role="tab"]');
              if (tab && tab.id !== TAB_ID) {
                active = false;
                restoreOtherPanels();
                const panel = document.getElementById(PANEL_ID);
                if (panel) panel.style.display = "none";
              }
            });
          }
          return true;
        };

        document.addEventListener("click", event => {
          const tab = event.target.closest?.('[role="tab"]');
          if (tab && tab.id !== TAB_ID) {
            active = false;
            restoreOtherPanels();
            const panel = document.getElementById(PANEL_ID);
            if (panel) panel.style.display = "none";
          }
        }, true);
        const observer = new MutationObserver(install);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        const timer = setInterval(() => { if (install()) clearInterval(timer); }, 100);
        install();
      })();
    </script>
    <script>
      (() => {
        const RECOVERY_ID = "runtime-recovery";
        const pending = new Map();
        let sequence = 0;
        let loading = false;
        let recovering = false;

        const rpc = (method, params = {}) => new Promise((resolve, reject) => {
          const id = `runtime-recovery-${Date.now()}-${++sequence}`;
          const timer = setTimeout(() => {
            pending.delete(id);
            reject(new Error(`MCP request timed out: ${method}`));
          }, 15000);
          pending.set(id, { resolve, reject, timer });
          window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
        });

        window.addEventListener("message", event => {
          if (event.source !== window.parent) return;
          const message = event.data;
          if (!message?.id || !pending.has(message.id)) return;
          const request = pending.get(message.id);
          pending.delete(message.id);
          clearTimeout(request.timer);
          if (message.error) request.reject(new Error(message.error.message || "MCP request failed"));
          else request.resolve(message.result);
        });

        const call = async (name, args = {}) => {
          const result = await rpc("tools/call", { name, arguments: args });
          const structured = result?.structuredContent || result;
          if (result?.isError || structured?.status === "error") {
            throw new Error([structured?.error_code, structured?.message].filter(Boolean).join(": ") || "MCP request failed");
          }
          return structured;
        };

        const runtimePanel = () => document.getElementById("panel-runtime");
        const recoveryCard = () => document.getElementById(RECOVERY_ID);
        const addText = (parent, className, value) => {
          const node = document.createElement("div");
          node.className = className;
          node.textContent = String(value || "");
          parent.appendChild(node);
          return node;
        };

        const render = info => {
          const panel = runtimePanel();
          if (!panel) return;
          const runtime = info?.runtime;
          const unavailable = runtime && runtime.status !== "connected";
          let card = recoveryCard();
          if (!unavailable) {
            card?.remove();
            return;
          }
          if (!card) {
            card = document.createElement("div");
            card.id = RECOVERY_ID;
            card.className = "mt-4 rounded-[var(--radius-sm)] border border-[var(--warning-border)] bg-[var(--warning-soft)] p-4";
            panel.appendChild(card);
          }
          card.replaceChildren();
          addText(card, "font-mono text-xs font-bold text-[var(--warning)]", "Runtime chưa sẵn sàng");
          addText(card, "mt-1 text-xs leading-relaxed text-[var(--text)]", "App Server đang mất kết nối nên Turbo bị khóa. Khôi phục runtime trước khi đổi chế độ.");
          if (runtime.error || runtime.command_error) {
            addText(card, "mt-2 break-all font-mono text-[10px] text-[var(--text-muted)]", runtime.error || runtime.command_error);
          }
          const button = document.createElement("button");
          button.type = "button";
          button.className = "mt-3 flex h-8 items-center rounded-[var(--radius-sm)] border border-[var(--warning-border)] bg-[var(--warning)] px-3 font-mono text-xs font-bold text-[#171406] hover:brightness-105 disabled:cursor-not-allowed disabled:opacity-50";
          button.textContent = recovering ? "Đang khôi phục…" : "Khôi phục runtime";
          button.disabled = recovering;
          button.addEventListener("click", async () => {
            if (recovering) return;
            recovering = true;
            render(info);
            try {
              await call("reconnect_runtime");
              document.querySelector('button[title="Làm mới trạng thái MCP"]')?.click();
              await refresh();
            } catch (error) {
              const detail = error?.message || "Không thể khôi phục runtime.";
              addText(card, "mt-2 break-all font-mono text-[10px] text-[var(--danger)]", detail);
            } finally {
              recovering = false;
              await refresh();
            }
          });
          card.appendChild(button);
        };

        async function refresh() {
          if (loading || !runtimePanel()) return;
          loading = true;
          try { render(await call("project_info")); } catch (_) { /* React keeps the host error visible. */ }
          finally { loading = false; }
        }

        const observer = new MutationObserver(() => {
          if (runtimePanel() && !recoveryCard()) refresh();
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
        setInterval(refresh, 2000);
      })();
    </script>
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased selection:bg-emerald-500/20 selection:text-emerald-300">
    <div id="root"></div>
  </body>
</html>
